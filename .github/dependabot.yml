version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    groups:
      vscode-extension-tooling:
        patterns:
          - '@vscode/*'
          - vscode-*
      typescript-tooling:
        patterns:
          - typescript
          - '@types/*'
          - typescript-eslint
      lint-format-tooling:
        patterns:
          - eslint
          - '@eslint/*'
          - prettier

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
